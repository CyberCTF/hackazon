# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Hackazon (by Rapid7) as an Isoloom spec: the upstream PHP source, vendored unchanged in
# build/hackazon/app/, served by a PHP 5.6 / Apache image we wrote (upstream has no Dockerfile),
# and a MariaDB machine. The image runs Hackazon's install wizard at first start.
# `isoloom generate`, then `isoloom up docker`.
version: 1
name: hackazon

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.25.0/24, internet: false}

machines:
  db:
    networks: {lab: 20}
    resources: {cpus: 1, memory_mb: 512}
    volumes: {data: /var/lib/mysql}
    ports:
      mariadb:
        port: 3306
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: build/db

  hackazon:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 512}
    depends_on: [db]
    ports:
      web:
        port: 80
        protocol: http
        publish: true
    app:
      build: build/hackazon
checks:
  - name: the store answers
    http: http://hackazon/
    wait: 180
  - name: test_user / 123456 logs in (the database is installed)
    script: checks/login.sh
    wait: 120
  - name: the REST API hands out a token
    script: checks/api.sh
  - name: admin / hackazon logs in to the back office
    script: checks/admin.sh

message: |
  Hackazon answers at {{ machines.hackazon.ports.web.url }}. The store is
  already installed: log in as test_user / 123456; the back office is /admin (admin / hackazon).
  The REST API used by the mobile app is under /api (start with /api/auth, basic auth).
